plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'checkstyle'
}

// Unused imports fail the build. See config/checkstyle/checkstyle.xml for why this is Checkstyle
// rather than Error Prone (no such bug pattern) or Spotless (rewrites hand-formatted files).
//
// The plugin wires checkstyleMain and checkstyleTest into `check` on its own, so `./gradlew build`
// catches this and both source sets are covered without naming them here.
checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    // What actually fails this build is maxErrors, which defaults to 0 — the ruleset declares
    // severity=error, so a violation is an error and the default is already the strict one.
    // maxWarnings is set for the case that ruleset ever gains a warning-severity rule: its default is
    // Integer.MAX_VALUE, so such a rule would otherwise report and pass. Inert today, on purpose.
    maxWarnings = 0
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/bluestep-systems/web-shared")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}

group = 'dev.bluestep'
// 2.0.0: nullable record components became Optional<T>.
// 3.0.0: PricedUnit deleted — the metered-unit vocabulary is an open unit_key string plus the
// descriptive UnitCategory/UnitMeasure axes and a RateVariant, and AiCompletionRequest carries an
// amount vector. Source-, binary- AND wire-breaking: AiUnitRateRequest gained three required
// discriminators, so a caller posting the old {provider, model, pricedUnit, rate} shape gets a 400.
// Both consumers (web, web-global) move to 3.0.0 together; neither can resolve it until the
// GitHub release is cut, because mavenLocal() is what makes an unreleased version look fine here.
// 4.0.0: the scope vocabulary is renamed — schemaName -> tenantId, organizationId -> unitId —
// across every AI DTO, and ai_tenant_config gains a first-class userId dimension. Source-breaking
// everywhere. WIRE-breaking only on the admin surfaces (AiTenantConfig*, AiTenantBlock*,
// AiUsageQuery*), whose components serialize under their own names; AiPreflightRequest is pinned to
// one-character @JsonProperty keys and AiCompletionRequest carries neither field, so the gate's hot
// path is byte-identical to 3.0.0 and 1.2.2. LegacyWireCompatTest is where that is checked rather
// than asserted. web-global serves both contracts side by side under version-tagged paths, so the
// fleet does not have to move in lockstep this time.
//
// 4.0.0 also ADDS two packages rather than changing any. dto.globaluser carries the catalog-scope
// classification web-global now owns outright — CatalogScopeKind replaces reading global.globaluser
// .super, which is a boolean that cannot express a reseller super. dto.reseller carries the
// read-only branding rows, mapped only so that a classification naming a reseller which does not
// exist can be refused rather than silently scoping its user to nothing. Both are purely additive,
// so they do not move the number; they rode 4.0.0 because 4.0.0 was not released yet, and a consumer
// resolving it therefore gets the vocabulary rename and these surfaces together or not at all.
//
// 4.1.0 adds the tenant-access grant shapes: TenantAccessGrantRequest/Response, TenantGrantsResponse
// and UserTenantsResponse. Purely additive, and a minor rather than a ride-along because 4.0.0 IS
// released now — the monolith pins it and web-global resolves it, so republishing that coordinate
// with different bytes would make a released version mean two things.
//
// They belong here rather than in web-global because the monolith is the caller they exist for. The
// tenant-access surface stopped being a report protocol that ages out and became grants an
// administrator writes and withdraws, and it is the monolith that knows who materializes in which
// tenant. Keeping the shapes private to the server would have meant the client either hand-rolling
// them or not being able to call at all.
//
// 4.1.1 adds the shapes the monolith needs to stop opening a second datasource onto the `global`
// schema and writing its own SQL against global.GLOBALUSER and global.RESELLER:
//   * dto.globaluserrecord — the globaluser ROW, listable and filterable, resolvable by username and
//     by OpenID (issuer, sub) within one organization, creatable and updatable. Deliberately a
//     different package from dto.globaluser, which is the tenant-catalog CLASSIFICATION and keeps
//     that meaning; the two are neighbours, not variants.
//   * dto.reseller gains ResellerRecordResponse (the twelve branding columns PLUS the display name
//     the monolith orders and renders by, which lives on the joined global.basetable row) and
//     ResellerUpdateRequest (the twelve editable columns). ResellerResponse itself is untouched, so
//     4.0.0 and 4.1.0 keep serving exactly the shape they promised and need no frozen snapshots.
//
// Purely additive, and the only change to an existing type is a compact constructor on ResellerIcons
// that maps an omitted field to Optional.empty() instead of null — same components, same wire, and
// needed because that record is now something a caller sends rather than only receives.
//
// A PATCH rather than a minor, unlike 4.1.0's additive bump. The number is not only a dependency
// coordinate here: ContractVersion.tag() puts it in the URL, so the jar version and the served path
// are one string, and this was ratified as the v4_1_1 contract binding. Nothing resolves it until the
// GitHub release is cut — mavenLocal() is what makes an unreleased version look fine in a sibling
// checkout, and web-global's app/build.gradle pins the coordinate it will need.
//
// 4.1.2 adds the credential write the 4.1.1 surface left out, and tightens what the 4.1.1 request
// shapes accept:
//   * GlobalUserCredentialUpdateRequest — the credential on its own verb. 4.1.1 omitted it from
//     update as a consequence of the "no credential rides an account edit" rule rather than as a
//     decision, which left the monolith's admin screen setting a password on its model and calling
//     update: accepted, discarded, no error. The whole-record update still cannot touch the column.
//   * @Size on the bounded string components of the globaluser record WRITE shapes (create and
//     update), derived from the column widths (firstname/lastname 30, username 50, useremail 255,
//     attribs 4000) rather than guessed. NOT on UsernameLookupRequest, which names the same
//     varchar(50) column: a lookup does not write, so an over-long name there is currently a
//     well-defined 404 rather than an error, and turning that into a 400 would change how a shipped
//     tag answers a request it already answers coherently.
//     An over-long value was reaching a transaction and being refused by Postgres, which
//     the consumer then has to translate: web-global maps it to a bare-string 400 that names no
//     field, and its own handler says outright that naming the constraint would be better but the
//     cause chain is vendor SQL. A constraint answers at the edge with the field. No valid request
//     changes behaviour, which is why this is safe to apply to shapes 4.1.1 already serves — the
//     values it newly refuses are values the database refused anyway.
//   * @Positive on the create request's classid. This one DOES narrow what an already-released tag
//     accepts -- classid 0 was a 201 creating a row under a class nothing can find, and is now a 400 --
//     but it refuses only an incoherent key, never a usable one, so it is a bug fix rather than a
//     contract change. Measured: no non-positive classid exists.
//
// A shape guard on attribs was written and WITHDRAWN. It belongs in the same family as the credential
// guard and catches the same kind of mistake, but it is not free the way @Size is: attribs is
// varchar(4000) with no CHECK, so Postgres accepts 'PLATFORM_A,PLATFORM_B' happily, and these shapes
// are served by an ALREADY-RELEASED tag whose controller binds them -- so the guard would refuse
// values 4.1.1 stored with a 201. Worse, the update is a whole-record replace and a read hands the
// stored value straight back, so any row already holding a non-Base64 attribs would become
// un-editable through the API: GET, change a surname, PUT, 400, with no way for the caller to comply.
// Zero such rows exist on a development copy, but that is one schema and the constraint's blast radius
// is every tenant. Reinstating it needs a fleet-wide count first, and probably a tag that has not
// shipped yet.
//
// NO verify operation, deliberately. The obvious companion — monolith encodes a candidate, this
// service compares bytes, answers a boolean — is unsound against the real data: 133 of 237 credential
// -carrying accounts (56.1%) in a development copy of the global schema hold an EARLIER cipher
// generation, which the monolith reads by decoding rather than matching. A byte comparison would
// refuse the correct password for those. StoredForm carries the measurement; verify wants that
// population at zero first.
//
// Additive on the wire, with one correction that goes the other way. The constraint annotations
// themselves serialize and bind identically. But a @AssertTrue method is a JavaBeans getter, so
// Jackson was serializing the derived booleans as properties — 4.1.1's create request has been
// emitting `storedCredentialInStoredForm` since it shipped, and the new attribs guard would have
// added `attribsInStoredForm` to the update request too. A record that emits a property it cannot
// bind back does not round-trip through its own mapper. All four are @JsonIgnore now, so 4.1.2
// REMOVES a spurious field rather than adding one; nothing reads it, and a consumer tolerant enough
// to have accepted it is tolerant of its absence. The same leak exists on GlobalUserScopeEntry and
// GlobalUserScopeRequest, shipped in 4.0.0, and is deliberately left alone here — retrofitting types
// this change has no other business touching is a separate decision.
// A PATCH for the same reason 4.1.1 was: ContractVersion.tag() puts this number in the URL, so the
// jar version and the served path are one string. Nothing resolves it until the GitHub release is
// cut — mavenLocal() is what makes an unreleased version look fine in a sibling checkout.
//
// 4.1.3 makes the credential REQUIRED, and fixes the same @AssertTrue serialization defect on two
// older shapes.
//
// GlobalUserCredentialUpdateRequest.storedCredential is a plain @NotBlank String rather than an
// Optional. 4.1.2 read an empty Optional as "clear the credential", which put a destructive operation
// behind `{}` -- the most likely malformed body this endpoint can receive, and the exact payload its
// intended caller produces by accident. The monolith never loads a credential (nothing returns one),
// so its model holds null for the password unless an admin has just typed one; a request built from
// that model without checking would have sent `{}` and deleted the account's password while reporting
// success. An admin screen with the password box left blank is precisely that case. Now it is a 400
// naming the field. There is deliberately NO way to clear a credential on this shape: an update that
// names nothing to write is incoherent rather than a request to delete, and if clearing is ever wanted
// it wants its own verb.
//
// This is a BREAKING change to a shape 4.1.2 shipped -- a caller sending {"storedCredential": null},
// or omitting it, moves from 200 to 400 -- which is why it costs a version rather than riding 4.1.2.
// A caller that sent a real credential is unaffected.
//
// @JsonIgnore on GlobalUserScopeEntry and GlobalUserScopeRequest, which carry the identical defect
// fixed on the globaluserrecord shapes in 4.1.2: a @AssertTrue method is a JavaBeans getter, so
// Jackson has been publishing `resellerConsistentWithScope` as a record property since 4.0.0, and a
// record that emits a field it cannot bind back does not round-trip through its own mapper. Removes a
// spurious field; nothing reads it. GlobalUserScopeWireTest is the coverage that would have caught it,
// matching what GlobalUserRecordWireTest does next door.
// 4.1.3, re-released. The column-width bounds now count CODE POINTS, not UTF-16 code units, via a
// @CodePointSize constraint of our own. @Size counts String.length(); varchar(n) counts characters.
// For anything outside the Basic Multilingual Plane Java counts two where Postgres counts one, so
// @Size(max = 30) refused a sixteen-character name the column stores happily. On a whole-record
// update that is not merely over-strict: the read hands the stored value back verbatim and the write
// then refuses it, so a row already holding such a value could not be edited through the API at all.
// That is exactly the round-trip hazard the attribs guard was withdrawn over, so leaving it here
// would have been inconsistent as well as wrong. With code points, "refuses only what the database
// refuses anyway" is finally a true statement rather than an approximation.
//
// Applied to every bound that mirrors a varchar: the globaluser record write shapes and
// ResellerUpdateRequest's two. NOT to the bounds that mirror no column (LinkedAccount's jsonb
// issuer/sub, the scope shapes' reason/actor), which are chosen limits and stay @Size.
//
// A ConstraintValidator rather than a compact-constructor check, deliberately: a compact constructor
// throws during Jackson binding, BEFORE Bean Validation runs, producing a
// HttpMessageNotReadableException -- a 400 with no fieldErrors array and no field name -- where every
// other constraint here produces the field-level shape the services' tests assert.
//
// Re-released over the same number rather than cut as 4.1.4, so the tag and the artifact stay one
// string. Anyone who resolved the earlier 4.1.3 holds a stale jar under a number whose content
// changed; --refresh-dependencies is what clears it.
//
// 4.1.4 names a third credential generation: one-way, Argon2id, which the monolith cannot read back
// and does not want to. StoredForm gains it, with a body shape of its own.
//
// The set it joins was deliberately closed, and the reasoning that closed it was sound and is now
// half wrong. It ran: an unrecognised generation decodes to nothing, a credential that decodes to
// nothing is an account that can never sign in, so refusing one protects the account. That inference
// held for every generation the constraint was written against, because all of them were ciphers and
// reading one back was how a password was checked. It does not hold for this one -- a `\n2` value
// decodes to nothing on purpose and its account signs in perfectly well, because the monolith stopped
// verifying by decoding and now verifies against the stored form. "Cannot be read back" became a
// property to want rather than a symptom to catch. The monolith's docs/password-hashing-plan.md is
// the whole of that argument; CU-86bbn5r5v is the work.
//
// So the set stays closed and gains a member rather than being opened, and each generation is held to
// ITS OWN body shape rather than to a single one. A `\n2` carrying a Base64 body is still refused,
// exactly as it was before the generation existed; what is accepted is the Argon2id encoded form,
// optionally behind a key=value segment carrying what the monolith knew about the password at the one
// moment it had it. That segment is held to a shape rather than to a list of keys, because its keys
// are the monolith's to add.
//
// PURELY WIDENING on the wire, which is the reason this is safe to apply to shapes already-released
// tags bind. The shared records are bound by every version's controllers, so a constraint change
// reaches the released tags too — the Surface split governs routing and only routing. Every value any
// tag accepted before, it accepts now; the only difference is a shape that used to be a 400 and is now
// a 201. That is the opposite of the round-trip hazard the attribs guard was withdrawn over.
//
// NO ContractVersion entry, deliberately, and this is the first release where that is a decision
// rather than an omission. Nothing is reshaped and no surface is added, so a /api/v4.1.4/ tag would
// answer byte-identically to /api/v4.1.3/ in every particular — a routable name for a distinction
// that does not exist. The precedent is 4.1.2, which shipped as an artifact and never as a tag. What
// does follow from that: this loosening reaches every live tag the moment web-global resolves it,
// which is the intended behaviour and is why the ordering below matters.
//
// ORDERING, because a credential is not a field you get to fix afterwards. web-global must be running
// this artifact BEFORE any monolith writes the generation, or a password change is a 400 at the edge.
// The monolith guards that from its side: security.one-way-global-passwords is off by default and is
// documented as turnable-on only once every ring can read `\n2`. The two guards are independent on
// purpose — neither service has to trust the other's rollout.
//
// 4.1.5 adds dto.usage: the tenant usage metering shapes. Purely additive — no existing type changes.
//   * UsageBatchRequest / UsageWindow MOVE here from web-global, byte-identical on the wire (same
//     single-character keys, same bounds). Until now web-global and the monolith each kept a
//     hand-maintained copy, so a coordinated-but-mismatched edit passed both repos' key tests and
//     mis-bound every batch. One record, one UsageWireContractTest, closes that.
//   * StorageSampleBatchRequest / StorageSample are the disk sampler's push. An empty pass is valid:
//     it is the namespace's heartbeat, which the staleness check needs to tell "no tenants" from
//     "sampler dead". sampledAt is an OffsetDateTime period start. Alignment, skew, age and
//     duplicate-tenant refusals belong to web-global's ingest, since each needs server time or
//     its normalization. A sample carries a Map of meter key -> bytes rather than one component
//     per figure: a new kind of storage is a new key in web-global's storage_meter catalog, not a
//     new record shape every deployed producer must be rebuilt against (the lesson 008's open
//     unit_key vocabulary learned on the AI side).
//   * StorageUsageResponse / StorageLevel / StorageUsageDay are the storage read, one shape for the
//     tenant and internal paths — per-meter rows, so which meters a tenant sees is the catalog's
//     tenant_visible flag, not a type. Days carry sampleCount so a sampler gap is visible, and the
//     response echoes its from/to.
//   (Amended before release: 4.1.5 first merged a one-column-per-figure shape with a separate
//   internal response type. It never shipped, so it was reshaped in place rather than as 4.1.6.)
//   Full-word keys on all of these: a sample is one row per tenant per period, so the per-minute
//   lane's single-character economy buys nothing.
//
// NO ContractVersion entry, and not merely by the 4.1.2/4.1.4 precedent: these shapes are served
// under /api/v1/usage/, which is not tag-routed at all. A consumer moving to 4.1.5 changes no AI or
// global-user path.
//
// ORDERING: web-global deletes its own dto.usage copies in the same change that resolves 4.1.5 —
// the package name is identical, so keeping both would put two classes of one name on its
// classpath. The monolith can move before or after; the bytes on the wire are the same either way.
//
// 4.1.5 also gives a reseller a switch word: `flags`, a bigint on global.reseller, on
// ResellerRecordResponse and ResellerUpdateRequest. A RIDER on an unreleased number rather than a
// 4.1.6, on the 4.0.0 precedent — dto.globaluser and dto.reseller rode 4.0.0 because 4.0.0 was not
// released yet, and a rider costs nothing while nothing can have resolved the number. 4.1.5 is
// merged and NOT released; the moment it is, this would have to be 4.1.6 instead.
//
// Served as the raw word, not as named booleans, which is the entire reason the column is a bit set:
// the reseller-level switches this opens the door to cost a bit position each and nothing here. This
// service stores and returns the number and interprets none of it, the way it stores a branding URL
// it never fetches. A `long` rather than an Optional because the column is NOT NULL DEFAULT 0 — zero
// is a configuration, not an absence.
//
// ONE DELIBERATE BREAK in ResellerUpdateRequest's whole-set rule: an absent `flags` leaves the stored
// word standing where an absent value anywhere else on that record clears its column. Forced by how
// the shape is served — the shared records are bound by EVERY live tag's controllers, not by frozen
// per-version copies, so a component added here reaches tags that shipped before it existed. A caller
// on such a tag cannot name a field it has never heard of, so under the whole-set rule its ordinary
// branding save would post no `flags` and silently clear every bit. Widening what an older tag accepts
// is safe; letting it destroy a value it cannot see is not. A caller that really means "all switches
// off" sends 0, which is still one call and still idempotent.
//
// Additive on the response side, and safe for builds already in rotation: the monolith's
// WebGlobalClient.mapper() disables FAIL_ON_UNKNOWN_PROPERTIES, so a replica holding an older jar
// ignores the new field rather than failing the read. Recorded here, like the 4.1.3 @JsonIgnore note,
// so that a shipped tag emitting one more property is not later found as unexplained drift.
//
// 4.1.6 adds UsageSummaryResponse / UsageSummaryRow: per-tenant totals of the usage batch metrics
// over a time range, the read the monolith's Page Statistics report and ServerBalancer cut over to
// (usage metering phase 5, CU-86bbugbjn). Purely additive. Served under /api/v1/usage/summary, which
// is not tag-routed, so again NO ContractVersion entry.
// 4.1.7 adds DbUsageBatchRequest / DbUsageRow: a namespace's pg_stat_statements diff, per-tenant
// server-side DB time and buffer blocks plus the eviction/reset signals that say how far to trust it
// (usage metering phase 4b, CU-86bc6fw3m). Purely additive. Served under /api/v1/usage/db, which is
// not tag-routed, so again NO ContractVersion entry.
//
// 5.0.0: the published POM no longer carries Jackson 2. Dependency-breaking, wire-neutral.
//   * REMOVED from the POM: the com.fasterxml.jackson:jackson-bom:2.22.1 platform (an `api` import
//     that raised every consumer's whole Jackson 2 family, highest-wins) and
//     com.fasterxml.jackson.datatype:jackson-datatype-jdk8 (there so a Jackson 2 mapper could bind
//     the Optional<T> components). Their last consumer was web-global's Jackson 2 msgpack converter,
//     deleted in phase 3 of the msgpack retirement; nothing in the fleet sends application/x-msgpack
//     any more (the monolith moved to CBOR in release 26.08.24.00), so nothing needs a Jackson 2
//     mapper to bind these records.
//   * KEPT: com.fasterxml.jackson.core:jackson-annotations, now versioned on its own (2.21, the line
//     Jackson 3.1 declares) because no platform manages it. The DTOs carry @JsonProperty/@JsonIgnore,
//     and Jackson 3 reads that same package.
//   * CONSUMERS MUST BRING THEIR OWN JACKSON 3. Spring Boot 4 does, and Jackson 3 binds Optional<T>
//     in core with no module. A consumer still binding these DTOs with a Jackson 2 mapper must now
//     declare jackson-datatype-jdk8 itself and register it, or every Optional component binds null.
//     The monolith already excluded the jdk8 module from this dependency, so it is unaffected.
//   * DTOs UNCHANGED, source, binary and wire: no record, component, key or constraint moved. The
//     Jackson 3 wire-contract tests were kept and pin the same bytes; only the tests comparing a
//     Jackson 2 or msgpack wire against the Jackson 3 one were retired, with the last consumer that
//     spoke either. The msgpack and Jackson 2 test dependencies went with them, and the Jackson 3
//     test dependencies moved to 3.1.6 (GHSA-q4xh-88c3-wmh7 / CVE-2026-68497, GHSA-wjgm-6hv5-3cvf).
//   A MAJOR because removing transitive dependencies a consumer may have been compiling against is a
//   breaking change to the artifact even though not one byte on the wire moves.
//
//   No unreleased root changes ride along: 4.1.6 and 4.1.7 are both released (4.1.7 is the tag this
//   branch starts from), so 5.0.0 is 4.1.7 plus exactly the dependency change above. The secret-files
//   subproject in this repo is a separate coordinate on its own version line and is not part of
//   this number.
//
//   ContractVersion: unlike 4.1.4-4.1.7, this one IS a served tag. The artifact version and the path
//   are one string, so a consumer resolving 5.0.0 will spell /api/v5.0.0/; web-global declares V5_0_0
//   serving the same surfaces as 4.1.3, byte-identically, beside every older tag rather than in place
//   of any. Release order: this artifact first, then web-global (which serves the new tag), and only
//   then any consumer that moves to 5.0.0 — a consumer on 5.0.0 talking to a web-global without
//   V5_0_0 gets 404s, and the AI gate fails closed on a 404.
version = '5.0.0'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// NullAway in JSpecify mode. `OnlyNullMarked` makes @NullMarked the single source of
// truth: a package is analysed only once its package-info opts in, so new packages can
// be adopted one at a time instead of all at once. Every dto package is already marked.
//
// Tests are deliberately excluded — test code legitimately passes null to exercise the
// guards, and NullAway would flag each of those as an error.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // NullAway is the only check we opt into; the rest of Error Prone's catalogue is
        // a separate decision with its own remediation cost.
        disableAllChecks = true
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        error('NullAway')
    }
}

tasks.named('compileTestJava') {
    options.errorprone.enabled = false
}

test {
    useJUnitPlatform()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.8'

    // `api`, not `compileOnly`: the annotations are part of this module's published
    // contract, so consumers compiling against these DTOs see the same nullness.
    api 'org.jspecify:jspecify:1.0.1'

    // The ONLY Jackson artifact this module publishes, and the only one its source touches: the DTOs
    // carry @JsonProperty / @JsonIgnore, and Jackson 3 kept com.fasterxml.jackson.annotation as its
    // annotation package, so one jar serves both families. No mapper, no datatype module and no BOM
    // ride along — a consumer brings its own Jackson 3 (Spring Boot 4 does), and Jackson 3 binds
    // Optional<T> components in core, with nothing registered (OptionalWireContractTest pins that).
    //
    // Versioned explicitly because there is no platform to manage it any more. 2.21 is the
    // jackson-annotations line the Jackson 3.1 BOM declares (jackson.version.annotations in
    // tools.jackson:jackson-bom:3.1.6), so this asks for exactly what a 3.1 consumer already resolves
    // rather than raising it. A consumer's own BOM still wins where it manages the artifact.
    //
    // 5.0.0 removed the two Jackson 2 declarations that used to sit here: the
    // com.fasterxml.jackson:jackson-bom platform (which RAISED every consumer's whole Jackson 2
    // family, highest-wins) and jackson-datatype-jdk8 (which existed so a Jackson 2 mapper could bind
    // the Optional components). Their last consumer, web-global's msgpack converter, is retired.
    api 'com.fasterxml.jackson.core:jackson-annotations:2.21'
    api 'jakarta.validation:jakarta.validation-api:3.1.1'
    // NOT declared here, and since 5.0.0 not declared anywhere: msgpack is retired fleet-wide.
    // This module's source never referenced it — it was once a pass-through `api` dependency,
    // which meant a DTO library forced a wire format onto every consumer.

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // The constraint annotations ARE part of this module's published contract now — @Size derived
    // from column widths, and two @AssertTrue guards over opaque columns — so "the annotation is
    // present in the source" is not evidence that it fires. Without a provider on the test
    // classpath, swapping two @Size values or moving one somewhere Bean Validation never reads it
    // leaves the whole suite green. This is the provider the consumers run (Boot's starter-validation
    // pulls the same family), so what fires here is what fires there.
    testImplementation 'org.hibernate.validator:hibernate-validator:9.0.1.Final'
    // 1.5.0+: earlier ArchUnit bundles an ASM that cannot read Java 25 class files (major
    // 69). It fails silently — the import yields zero classes and every rule passes
    // vacuously — which is what scanFoundTheDtoRecords() exists to catch.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    // Jackson 3 (tools.jackson.*), the family every consumer runs: web-global's and the monolith's
    // Boot 4 mappers are Jackson 3, for JSON and for CBOR. The wire-contract tests are only worth
    // anything if they exercise the Jackson the consumers actually run, so this tracks web-global's
    // jackson-bom pin. 3.1.6 rather than 3.1.5: GHSA-q4xh-88c3-wmh7 (CVE-2026-68497) and
    // GHSA-wjgm-6hv5-3cvf.
    //
    // No Jackson 2 and no msgpack on the test classpath either, since 5.0.0. The tests that compared
    // a Jackson 2 or msgpack wire against the Jackson 3 one were retired with the last consumer that
    // spoke either; their Jackson 3 assertions were kept and now pin the wire on their own.
    testImplementation 'tools.jackson.core:jackson-databind:3.1.6'
    // Test-only: UsageWireContractTest and LegacyWireCompatTest round-trip the DTOs through CBOR,
    // the binary format producers and the AI gate client push them in.
    testImplementation 'tools.jackson.dataformat:jackson-dataformat-cbor:3.1.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
