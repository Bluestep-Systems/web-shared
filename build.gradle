plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'checkstyle'
}

// Unused imports fail the build. See config/checkstyle/checkstyle.xml for why this is Checkstyle
// rather than Error Prone (no such bug pattern) or Spotless (rewrites hand-formatted files).
//
// The plugin wires checkstyleMain and checkstyleTest into `check` on its own, so `./gradlew build`
// catches this and both source sets are covered without naming them here.
checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    // What actually fails this build is maxErrors, which defaults to 0 — the ruleset declares
    // severity=error, so a violation is an error and the default is already the strict one.
    // maxWarnings is set for the case that ruleset ever gains a warning-severity rule: its default is
    // Integer.MAX_VALUE, so such a rule would otherwise report and pass. Inert today, on purpose.
    maxWarnings = 0
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/bluestep-systems/web-shared")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}

group = 'dev.bluestep'
// 2.0.0: nullable record components became Optional<T>.
// 3.0.0: PricedUnit deleted — the metered-unit vocabulary is an open unit_key string plus the
// descriptive UnitCategory/UnitMeasure axes and a RateVariant, and AiCompletionRequest carries an
// amount vector. Source-, binary- AND wire-breaking: AiUnitRateRequest gained three required
// discriminators, so a caller posting the old {provider, model, pricedUnit, rate} shape gets a 400.
// Both consumers (web, web-global) move to 3.0.0 together; neither can resolve it until the
// GitHub release is cut, because mavenLocal() is what makes an unreleased version look fine here.
// 4.0.0: the scope vocabulary is renamed — schemaName -> tenantId, organizationId -> unitId —
// across every AI DTO, and ai_tenant_config gains a first-class userId dimension. Source-breaking
// everywhere. WIRE-breaking only on the admin surfaces (AiTenantConfig*, AiTenantBlock*,
// AiUsageQuery*), whose components serialize under their own names; AiPreflightRequest is pinned to
// one-character @JsonProperty keys and AiCompletionRequest carries neither field, so the gate's hot
// path is byte-identical to 3.0.0 and 1.2.2. LegacyWireCompatTest is where that is checked rather
// than asserted. web-global serves both contracts side by side under version-tagged paths, so the
// fleet does not have to move in lockstep this time.
//
// 4.0.0 also ADDS two packages rather than changing any. dto.globaluser carries the catalog-scope
// classification web-global now owns outright — CatalogScopeKind replaces reading global.globaluser
// .super, which is a boolean that cannot express a reseller super. dto.reseller carries the
// read-only branding rows, mapped only so that a classification naming a reseller which does not
// exist can be refused rather than silently scoping its user to nothing. Both are purely additive,
// so they do not move the number; they rode 4.0.0 because 4.0.0 was not released yet, and a consumer
// resolving it therefore gets the vocabulary rename and these surfaces together or not at all.
//
// 4.1.0 adds the tenant-access grant shapes: TenantAccessGrantRequest/Response, TenantGrantsResponse
// and UserTenantsResponse. Purely additive, and a minor rather than a ride-along because 4.0.0 IS
// released now — the monolith pins it and web-global resolves it, so republishing that coordinate
// with different bytes would make a released version mean two things.
//
// They belong here rather than in web-global because the monolith is the caller they exist for. The
// tenant-access surface stopped being a report protocol that ages out and became grants an
// administrator writes and withdraws, and it is the monolith that knows who materializes in which
// tenant. Keeping the shapes private to the server would have meant the client either hand-rolling
// them or not being able to call at all.
//
// 4.1.1 adds the shapes the monolith needs to stop opening a second datasource onto the `global`
// schema and writing its own SQL against global.GLOBALUSER and global.RESELLER:
//   * dto.globaluserrecord — the globaluser ROW, listable and filterable, resolvable by username and
//     by OpenID (issuer, sub) within one organization, creatable and updatable. Deliberately a
//     different package from dto.globaluser, which is the tenant-catalog CLASSIFICATION and keeps
//     that meaning; the two are neighbours, not variants.
//   * dto.reseller gains ResellerRecordResponse (the twelve branding columns PLUS the display name
//     the monolith orders and renders by, which lives on the joined global.basetable row) and
//     ResellerUpdateRequest (the twelve editable columns). ResellerResponse itself is untouched, so
//     4.0.0 and 4.1.0 keep serving exactly the shape they promised and need no frozen snapshots.
//
// Purely additive, and the only change to an existing type is a compact constructor on ResellerIcons
// that maps an omitted field to Optional.empty() instead of null — same components, same wire, and
// needed because that record is now something a caller sends rather than only receives.
//
// A PATCH rather than a minor, unlike 4.1.0's additive bump. The number is not only a dependency
// coordinate here: ContractVersion.tag() puts it in the URL, so the jar version and the served path
// are one string, and this was ratified as the v4_1_1 contract binding. Nothing resolves it until the
// GitHub release is cut — mavenLocal() is what makes an unreleased version look fine in a sibling
// checkout, and web-global's app/build.gradle pins the coordinate it will need.
//
// 4.1.2 adds the credential write the 4.1.1 surface left out, and tightens what the 4.1.1 request
// shapes accept:
//   * GlobalUserCredentialUpdateRequest — the credential on its own verb. 4.1.1 omitted it from
//     update as a consequence of the "no credential rides an account edit" rule rather than as a
//     decision, which left the monolith's admin screen setting a password on its model and calling
//     update: accepted, discarded, no error. The whole-record update still cannot touch the column.
//   * @Size on the bounded string components of the globaluser record WRITE shapes (create and
//     update), derived from the column widths (firstname/lastname 30, username 50, useremail 255,
//     attribs 4000) rather than guessed. NOT on UsernameLookupRequest, which names the same
//     varchar(50) column: a lookup does not write, so an over-long name there is currently a
//     well-defined 404 rather than an error, and turning that into a 400 would change how a shipped
//     tag answers a request it already answers coherently.
//     Note @Size counts UTF-16 code units where varchar(n) counts characters, so a 30-emoji first
//     name is 60 to the constraint and 30 to Postgres. Always stricter, never looser, so nothing
//     unstorable slips through — but it is not exactly the column bound.
//     An over-long value was reaching a transaction and being refused by Postgres, which
//     the consumer then has to translate: web-global maps it to a bare-string 400 that names no
//     field, and its own handler says outright that naming the constraint would be better but the
//     cause chain is vendor SQL. A constraint answers at the edge with the field. No valid request
//     changes behaviour, which is why this is safe to apply to shapes 4.1.1 already serves — the
//     values it newly refuses are values the database refused anyway.
//   * @Positive on the create request's classid. This one DOES narrow what an already-released tag
//     accepts -- classid 0 was a 201 creating a row under a class nothing can find, and is now a 400 --
//     but it refuses only an incoherent key, never a usable one, so it is a bug fix rather than a
//     contract change. Measured: no non-positive classid exists.
//
// A shape guard on attribs was written and WITHDRAWN. It belongs in the same family as the credential
// guard and catches the same kind of mistake, but it is not free the way @Size is: attribs is
// varchar(4000) with no CHECK, so Postgres accepts 'PLATFORM_A,PLATFORM_B' happily, and these shapes
// are served by an ALREADY-RELEASED tag whose controller binds them -- so the guard would refuse
// values 4.1.1 stored with a 201. Worse, the update is a whole-record replace and a read hands the
// stored value straight back, so any row already holding a non-Base64 attribs would become
// un-editable through the API: GET, change a surname, PUT, 400, with no way for the caller to comply.
// Zero such rows exist on a development copy, but that is one schema and the constraint's blast radius
// is every tenant. Reinstating it needs a fleet-wide count first, and probably a tag that has not
// shipped yet.
//
// NO verify operation, deliberately. The obvious companion — monolith encodes a candidate, this
// service compares bytes, answers a boolean — is unsound against the real data: 133 of 237 credential
// -carrying accounts (56.1%) in a development copy of the global schema hold an EARLIER cipher
// generation, which the monolith reads by decoding rather than matching. A byte comparison would
// refuse the correct password for those. StoredForm carries the measurement; verify wants that
// population at zero first.
//
// Additive on the wire, with one correction that goes the other way. The constraint annotations
// themselves serialize and bind identically. But a @AssertTrue method is a JavaBeans getter, so
// Jackson was serializing the derived booleans as properties — 4.1.1's create request has been
// emitting `storedCredentialInStoredForm` since it shipped, and the new attribs guard would have
// added `attribsInStoredForm` to the update request too. A record that emits a property it cannot
// bind back does not round-trip through its own mapper. All four are @JsonIgnore now, so 4.1.2
// REMOVES a spurious field rather than adding one; nothing reads it, and a consumer tolerant enough
// to have accepted it is tolerant of its absence. The same leak exists on GlobalUserScopeEntry and
// GlobalUserScopeRequest, shipped in 4.0.0, and is deliberately left alone here — retrofitting types
// this change has no other business touching is a separate decision.
// A PATCH for the same reason 4.1.1 was: ContractVersion.tag() puts this number in the URL, so the
// jar version and the served path are one string. Nothing resolves it until the GitHub release is
// cut — mavenLocal() is what makes an unreleased version look fine in a sibling checkout.
version = '4.1.2'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// NullAway in JSpecify mode. `OnlyNullMarked` makes @NullMarked the single source of
// truth: a package is analysed only once its package-info opts in, so new packages can
// be adopted one at a time instead of all at once. Every dto package is already marked.
//
// Tests are deliberately excluded — test code legitimately passes null to exercise the
// guards, and NullAway would flag each of those as an error.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // NullAway is the only check we opt into; the rest of Error Prone's catalogue is
        // a separate decision with its own remediation cost.
        disableAllChecks = true
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        error('NullAway')
    }
}

tasks.named('compileTestJava') {
    options.errorprone.enabled = false
}

test {
    useJUnitPlatform()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.8'

    // `api`, not `compileOnly`: the annotations are part of this module's published
    // contract, so consumers compiling against these DTOs see the same nullness.
    api 'org.jspecify:jspecify:1.0.1'

    // A BOM rather than three hand-pinned versions: the Jackson 2 artifacts have to move as
    // a family, and pinning them individually is how they drift apart. 2.22.1 is the floor
    // web-global runs (Boot 4 overrides its own managed version to reach it, for
    // CVE-2026-54515) — matching it here means this module never publishes a POM asking for
    // a version below what its consumers were deliberately raised to.
    //
    // Note this RAISES a consumer rather than only setting a floor: Gradle resolves
    // highest-wins, so a consumer declaring an older Jackson BOM is pulled up to 2.22.1
    // rather than winning. That is the intent for a security floor, but it means a consumer
    // that deliberately pins Jackson 2 down for a compatibility reason cannot do so while
    // depending on this module — they would need an explicit `resolutionStrategy.force`.
    api platform('com.fasterxml.jackson:jackson-bom:2.22.1')
    api 'com.fasterxml.jackson.core:jackson-annotations'
    // Optional<T> record components only bind correctly when this module is registered on
    // the ObjectMapper, and almost nothing guards that at runtime: a mapper without the module
    // binds literal null into components the type system says can never be null.
    // AiCompletionRequest's compact constructor catches it for that one record's vector; every
    // other record here has no such guard. OptionalWireContractTest pins both halves of the
    // failure. Declaring it `api` means a consumer cannot end up with these DTOs and no
    // Optional support.
    //
    // Do not rely on Boot auto-configuration to supply it: Boot 4 has no Jackson 2
    // ObjectMapper auto-configuration at all (spring-boot-jackson auto-configures
    // tools.jackson only), which is why web-global's MessagePackConfig registers the module
    // by hand. Jackson 3 consumers do not need it — see OptionalWireContractJackson3Test.
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    api 'jakarta.validation:jakarta.validation-api:3.1.1'
    // NOT declared here. This module's source never references msgpack — it was a
    // pass-through `api` dependency, which meant a DTO library both forced a wire format
    // onto every consumer and silently owned its version in services that never declared
    // it. It now belongs to the module that configures the converter (web-global's app).
    // A consumer of these DTOs that speaks msgpack must declare the dataformat itself.

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // The constraint annotations ARE part of this module's published contract now — @Size derived
    // from column widths, and two @AssertTrue guards over opaque columns — so "the annotation is
    // present in the source" is not evidence that it fires. Without a provider on the test
    // classpath, swapping two @Size values or moving one somewhere Bean Validation never reads it
    // leaves the whole suite green. This is the provider the consumers run (Boot's starter-validation
    // pulls the same family), so what fires here is what fires there.
    testImplementation 'org.hibernate.validator:hibernate-validator:9.0.1.Final'
    // 1.5.0+: earlier ArchUnit bundles an ASM that cannot read Java 25 class files (major
    // 69). It fails silently — the import yields zero classes and every rule passes
    // vacuously — which is what scanFoundTheDtoRecords() exists to catch.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    // Unversioned so the jackson-bom above governs: the wire-contract tests are only worth
    // anything if they exercise the same Jackson the consumers actually run.
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    // Jackson 3 (tools.jackson.*) is a separate family from the above, not an upgrade of it.
    // web-global on Spring Boot 4 auto-configures a Jackson 3 mapper as its *primary* mapper
    // while keeping a Jackson 2 island for msgpack, so these DTOs are serialized by both.
    // OptionalWireContractJackson3Test pins that they produce an identical wire.
    testImplementation 'tools.jackson.core:jackson-databind:3.1.5'
    // Test-only: LegacyWireCompatTest pins the msgpack bytes the monolith exchanges with
    // the AI gate. Proving that contract is this module's job even though shipping the
    // dataformat is not.
    testImplementation 'org.msgpack:jackson-dataformat-msgpack:0.9.12'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
